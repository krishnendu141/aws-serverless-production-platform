name: CI / Lint / Test

on:
  push:
    branches: ["main","develop","chore/*"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/aws-serverless-production-platform/src/requirements.txt || true
      - name: Run linters
        run: |
          echo "No linters configured yet; add flake8/ruff if desired"
      - name: Run unit tests
        run: |
          echo "No unit tests yet; add pytest tests in src/" 
