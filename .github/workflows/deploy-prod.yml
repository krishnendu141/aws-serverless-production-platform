name: Deploy to Production (manual approval required)
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Init
        run: terraform -chdir=terraform/environments/prod init -input=false
      - name: Terraform Plan
        run: terraform -chdir=terraform/environments/prod plan -out=tfplan
      - name: Require human approval (hold)
        uses: chrnorm/deployment-approval@v2
        with:
          approvers: 'platform-team'
      - name: Terraform Apply
        run: terraform -chdir=terraform/environments/prod apply -input=false tfplan
